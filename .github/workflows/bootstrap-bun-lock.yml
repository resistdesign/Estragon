name: Bootstrap Bun lockfile

on:
  push:
    branches:
      - refactor/typescript-bun-tooling
    paths:
      - .github/workflows/bootstrap-bun-lock.yml

permissions:
  contents: write

jobs:
  create-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Resolve reproducible tooling dependencies
        run: bun install --lockfile-only
      - name: Commit generated Bun lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: lock Bun tooling dependencies"
          git push origin HEAD:refactor/typescript-bun-tooling
