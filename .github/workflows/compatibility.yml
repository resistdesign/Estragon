name: C01 compatibility evidence (not release certification)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compatibility-audit:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: ["4.0.4", "4.1.4", "4.2.2", "4.3", "4.4.1", "4.5.2", "4.6.3", "4.7.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify collector rejects false success and hung processes
        run: python3 -m unittest discover -s tests/compatibility -p 'test_*.py'
      - name: Download and verify pinned official engine
        env:
          TASK_GODOT_VERSION: ${{ matrix.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request, zipfile
          version = os.environ["TASK_GODOT_VERSION"]
          manifest = json.loads(pathlib.Path("tests/compatibility/engines.json").read_text())
          engine = next(item for item in manifest if item["version"].startswith(version + ".stable."))
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "godot.zip"
          urllib.request.urlretrieve(engine["official_archive_url"], archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == engine["archive_sha256"]
          binary = pathlib.Path(os.environ["RUNNER_TEMP"]) / "official-godot"
          with zipfile.ZipFile(archive) as source:
              binary.write_bytes(source.read("Godot.app/Contents/MacOS/Godot"))
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == engine["binary_sha256"]
          binary.chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("GODOT_BIN=" + str(binary) + "\n")
          PY
      - name: Collect actual addon/compiler/runtime/editor evidence
        # Audit-only exit mode. FAIL/BLOCKED/UNTESTED stay red in JSON. Existing
        # required 4.7 CI remains unchanged; C01 finalization adds a release gate.
        run: >-
          python3 tools/check-compatibility.py
          --engine '${{ matrix.version }}=${{ env.GODOT_BIN }}'
          --output '${{ runner.temp }}/compatibility'
          --editor --collect-only
      - name: Reject collection infrastructure failures
        if: always()
        env:
          TASK_RESULTS: ${{ runner.temp }}/compatibility/results.json
        run: |
          python3 - <<'PY'
          import json, os
          report = json.load(open(os.environ["TASK_RESULTS"]))
          assert len(report["engines"]) == 1
          stages = report["engines"][0]["stages"]
          assert "infrastructure" not in stages
          assert stages["engine_identity"]["status"] == "PASS"
          assert stages["api_dump"]["status"] == "PASS"
          assert stages["callback_metadata_probe"]["status"] == "PASS"
          PY
      - name: Require C01-B component sizing and input compatibility
        env:
          TASK_RESULTS: ${{ runner.temp }}/compatibility/results.json
        run: |
          python3 - <<'PY'
          import json, os
          engine = json.load(open(os.environ["TASK_RESULTS"]))["engines"][0]
          stages = engine["stages"]
          for name in ["components", "layout", "input_text", "reject_width",
                       "reject_height", "reject_negative_width", "reject_gap", "reject_geometry"]:
              assert stages[name]["status"] == "PASS", (engine["version"], name, stages[name])
          scripts = {item["source"]: item for item in stages["shipped_scripts"]["scripts"]}
          for name in ["container", "button"]:
              script = scripts["addons/estragon/runtime/" + name + ".gd"]
              assert script["status"] == "PASS", (engine["version"], script)
          PY
      - name: Require C01-E cold Text-first loading
        env:
          TASK_RESULTS: ${{ runner.temp }}/compatibility/results.json
        run: |
          python3 - <<'PY'
          import json, os
          engine = json.load(open(os.environ["TASK_RESULTS"]))["engines"][0]
          for name in ["cold_text", "reject_null_font", "reject_font_size"]:
              assert engine["stages"][name]["status"] == "PASS", (engine["version"], name)
          PY
      - name: Require C01-C generated callback compatibility
        env:
          TASK_RESULTS: ${{ runner.temp }}/compatibility/results.json
        run: |
          python3 - <<'PYCODE'
          import json, os
          engine = json.load(open(os.environ["TASK_RESULTS"]))["engines"][0]
          stages = engine["stages"]
          names = ["generated_signals"] + ["callback_guard_" + mode for mode in
              ["empty", "missing", "freed", "disposed", "required", "optional",
               "lambda_required", "lambda_optional", "unbound"]]
          for name in names:
              assert stages[name]["status"] == "PASS", (engine["version"], name, stages[name])
          scripts = {item["source"]: item for item in stages["shipped_scripts"]["scripts"]}
          assert scripts["examples/counter/generated/Counter.gd"]["status"] == "PASS"
          PYCODE
      - name: Require C01-D numeric value preservation
        env:
          TASK_RESULTS: ${{ runner.temp }}/compatibility/results.json
        run: |
          python3 - <<'PY'
          import json, os
          engine = json.load(open(os.environ["TASK_RESULTS"]))["engines"][0]
          for name in ["numeric_literals", "numeric_native_preservation"]:
              assert engine["stages"][name]["status"] == "PASS", (engine["version"], name)
          # Native IEEE conversion limitations remain explicitly BLOCKED in
          # results; owner-approved semantics require no further emission loss.
          PY
      - name: Publish actual stage outcomes
        if: always()
        env:
          TASK_RESULTS: ${{ runner.temp }}/compatibility/results.json
        run: |
          python3 - <<'PY'
          import json, os
          report = json.load(open(os.environ["TASK_RESULTS"]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("**Evidence collection only: green job does not certify compatibility.**\n\n")
              for engine in report["engines"]:
                  summary.write("Engine: " + engine.get("version", engine["label"]) + "\n\n")
                  summary.write("| Stage | Actual outcome |\n| --- | --- |\n")
                  for name, stage in engine["stages"].items():
                      summary.write("| " + name + " | **" + stage["status"] + "** |\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c01-macos-${{ matrix.version }}
          path: ${{ runner.temp }}/compatibility
          if-no-files-found: error
