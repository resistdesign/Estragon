name: Compiler checks

on:
  push:
  pull_request:

jobs:
  gogo-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck Gogo tooling
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Check committed example IR matches source
        run: bun run verify:ir
